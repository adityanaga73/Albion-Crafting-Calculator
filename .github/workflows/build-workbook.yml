name: Build Excel crafting calculator
on:
  push:
    paths:
      - 'build_workbook.py'
      - 'data/recipes_flat.csv'
      - 'data/item_names.csv'
      - '.github/workflows/build-workbook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python build_workbook.py
      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Albion_Crafting_Calculator_Excel2013_FINAL.xlsx
          git diff --cached --quiet || git commit -m "Build Excel 2013 crafting calculator"
          git push
